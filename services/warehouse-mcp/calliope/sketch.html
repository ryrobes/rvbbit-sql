<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Calliope Sketch</title>
  <style>html,body,#sketch-root{width:100%;height:100%;margin:0;overflow:hidden;background:#111b24}.sketch-loading{position:fixed;inset:0;display:grid;place-content:center;color:#91a7ae;font:12px system-ui;text-align:center}.sketch-loading i{width:38px;height:38px;margin:0 auto 12px;border:1px solid #35505a;border-top-color:#77c5d6;border-radius:50%;animation:spin .9s linear infinite}.sketch-loading strong,.sketch-loading span{display:block}.sketch-loading strong{color:#e8f2f4;letter-spacing:.08em;text-transform:uppercase}.sketch-loading span{margin-top:8px}@keyframes spin{to{transform:rotate(360deg)}}</style>
  <link rel="stylesheet" href="/calliope/sketch-runtime.css?v=__CALLIOPE_ASSET_VERSION__">
</head>
<body>
  <div id="sketch-root" data-sketch-id="__SKETCH_ID__" data-read-only="__SKETCH_READ_ONLY__" data-source-url="__SKETCH_SOURCE_URL__" data-presentation="__SKETCH_PRESENTATION__">
    <div class="sketch-loading"><i></i><strong>Opening shared sketch</strong><span>Restoring the latest editable checkpoint</span></div>
  </div>
  <script src="/calliope/sketch-bootstrap.js?v=__CALLIOPE_ASSET_VERSION__"></script>
  <script src="/calliope/sketch-runtime.js?v=__CALLIOPE_ASSET_VERSION__" defer></script>
</body>
</html>
