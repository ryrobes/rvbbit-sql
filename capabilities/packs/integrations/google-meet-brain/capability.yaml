api_version: rvbbit.capability/v1
kind: runtime_sidecar
name: google_meet_brain_connector
title: Google Meet Brain Connector
description: "Ingest generated Google Meet transcripts as invitee-governed Brain documents, with optional same-ACL derived meeting briefs."
license: apache-2.0
system_runtime: false
capability_role: brain_connector
tags: [google, workspace, meet, transcripts, meetings, documents, brain, knowledge, calendar, governed, cpu]
source:
  provider: google
  model: workspace/google-meet-transcripts
  url: https://developers.google.com/workspace/meet/api/guides/artifacts
runtime:
  mode: image
  template: runtime-sidecar
  image: "${RVBBIT_GMEET_CONNECTOR_IMAGE:-ghcr.io/ryrobes/rvbbit-gmeet-connector:latest}"
  pull_policy: always
  language: brain_connector
  handler: google_meet
  device: cpu
  port: 8080
  health_path: /health
  env:
    # Supply the service-account JSON itself as a one-line JSON value. A
    # compose-profile install may instead mount a file and set GMEET_SA_KEY to
    # that path; catalog/Warren installs intentionally do not copy credentials.
    GMEET_SA_KEY: ${GMEET_SA_KEY:-}
    GMEET_ADMIN_SUBJECT: ${GMEET_ADMIN_SUBJECT:-}
    GMEET_DOMAIN: ${GMEET_DOMAIN:-}
    GMEET_SUBJECTS: ${GMEET_SUBJECTS:-}
    GMEET_DISCOVER_USERS: ${GMEET_DISCOVER_USERS:-true}
    GMEET_MAX_SUBJECTS: ${GMEET_MAX_SUBJECTS:-500}
    GMEET_LOOKBACK_DAYS: ${GMEET_LOOKBACK_DAYS:-29}
    GMEET_CALENDAR_LOOKUP: ${GMEET_CALENDAR_LOOKUP:-true}
    GMEET_AUTO_TRANSCRIBE: ${GMEET_AUTO_TRANSCRIBE:-false}
    GMEET_AUTO_TRANSCRIBE_DAYS: ${GMEET_AUTO_TRANSCRIBE_DAYS:-7}
    GMEET_DRIVE_ACL: ${GMEET_DRIVE_ACL:-true}
    GMEET_ACL_MODE: ${GMEET_ACL_MODE:-calendar_invitees_strict}
    CONNECTOR_TOKEN: ${GMEET_CONNECTOR_TOKEN:-}
  volumes:
    - name: gmeet_connector_cache
      mount: /root/.cache/google-api-python-client
backend:
  name: gmeet_connector
  transport: rvbbit
  batch_size: 1
  max_concurrent: 1
  timeout_ms: 900000
  auth_env: GMEET_CONNECTOR_TOKEN
  description: "Google Meet transcript to governed Rvbbit Brain connector."
runtime_registration:
  name: gmeet_connector
  language: brain_connector
  endpoint_path: /sync
  auth_env: GMEET_CONNECTOR_TOKEN
  set_default: false
  labels:
    language: brain_connector
    capability_kind: runtime_sidecar
    capability_role: brain_connector
    provider: google_meet
brain_source:
  label: Google Meet
  kind: google_meet
  folder_prefix: /meetings
  creds_ref: GMEET_CONNECTOR_TOKEN
  enabled: true
  config:
    connector: gmeet_connector
    provider: google-meet
    doc_type: meeting
    source_kind: google_meet
    tombstone_missing: false
    lookback_days: 29
    calendar_lookup: true
    auto_transcribe: false
    auto_transcribe_days: 7
    drive_acl: true
    acl_mode: calendar_invitees_strict
    summarize_meetings: true
warren:
  endpoint_path: /sync
  health_path: /health
smoke:
  sql:
    - |
      DO $$
      BEGIN
          IF to_regprocedure('rvbbit.brain_configure_google_meet_source(text,boolean,jsonb)') IS NULL THEN
              RAISE EXCEPTION 'Google Meet Brain connector requires pg_rvbbit migration 0250 or newer';
          END IF;
          IF NOT EXISTS (
              SELECT 1 FROM rvbbit.backends
               WHERE name='gmeet_connector' AND endpoint_url LIKE '%/sync'
          ) THEN
              RAISE EXCEPTION 'gmeet_connector backend is not registered';
          END IF;
          IF NOT EXISTS (
              SELECT 1 FROM rvbbit.brain_sources
               WHERE label='Google Meet' AND kind='google_meet' AND enabled
                 AND config->>'acl_mode'='calendar_invitees_strict'
          ) THEN
              RAISE EXCEPTION 'Google Meet Brain source is not configured with strict invitee ACLs';
          END IF;
      END
      $$;
